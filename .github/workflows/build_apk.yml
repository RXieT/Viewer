name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 手动一键触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Java 17 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 配置 Flutter 环境 (Setup Flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 获取项目依赖 (Pub get)
        run: flutter pub get

      - name: 编译 Release APK (Build APK)
        run: flutter build apk --release

      - name: 上传 APK 产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Kemono-Viewer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
