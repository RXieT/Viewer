name: kemono_viewer
description: "A comfortable, non-destructive mobile shortcut and viewer for Kemono with custom domain support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # Local Storage & Preferences
  shared_preferences: ^2.2.3

  # Image & Media Handling
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0

  # UI Components & Styling
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  webview_flutter: ^4.7.0
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
